# Configuración del pipeline de extracción y procesamiento de SECOP 2
# Entregable 2: parametrización (entidad, periodo, etc.).
# Ajustado a los nombres REALES de columnas de SECOP II - Contratos Electrónicos.

# Token de aplicación de Socrata (opcional). Déjalo vacío para acceso público.
app_token: ""

# Tabla a extraer: contratos | procesos | proveedores | adiciones | integrado
tabla: contratos

# Tamaño de página para la paginación de la API
tamano_pagina: 50000

# Límite total de filas (deja null para descargar todo; usa un tope para pruebas).
limite_total: 5000

# Filtros de extracción (Entregable 2). Nombres de columna del dataset real.
# Deja el bloque vacío ({}) para no aplicar filtros.
filtros:
  ciudad: "Bogotá"
  sector: "Transporte"
  # fecha_de_firma:
  #   desde: "2024-01-01"
  #   hasta: "2024-12-31"

# Columnas a convertir a fecha. En SECOP II vienen como MM/DD/YYYY.
columnas_fecha:
  - fecha_de_firma
  - fecha_de_inicio_del_contrato
  - fecha_de_fin_del_contrato

# Formato de las fechas del dataset (mes/día/año).
formato_fecha: "%m/%d/%Y"

# Columnas de moneda a limpiar ("$13.339.049" -> 13339049.0)
columnas_moneda:
  - valor_del_contrato
  - valor_pagado
  - valor_pendiente_de_pago

# Columna identificadora para eliminar duplicados
subset_duplicados:
  - id_contrato

# Variables de duración entre fechas (en días), como en VigIA.
duraciones:
  - nombre: dias_firma_a_inicio
    desde: fecha_de_firma
    hasta: fecha_de_inicio_del_contrato
  - nombre: dias_inicio_a_fin
    desde: fecha_de_inicio_del_contrato
    hasta: fecha_de_fin_del_contrato
