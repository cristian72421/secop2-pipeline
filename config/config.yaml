# Parámetros del pipeline de SECOP 2. Ajustados a los nombres reales de
# columnas de SECOP II - Contratos Electrónicos.

# Token de aplicación de Socrata. Vacío = acceso público con límites más bajos.
app_token: ""

# contratos | procesos | proveedores | adiciones | integrado
tabla: contratos

# Filas por petición a la API
tamano_pagina: 50000

# Tope de filas a descargar. null = todo lo que devuelva el filtro.
limite_total: 5000

# Filtros de extracción. Bloque vacío ({}) = sin filtrar.
filtros:
  ciudad: "Bogotá"
  sector: "Transporte"
  # fecha_de_firma:
  #   desde: "2024-01-01"
  #   hasta: "2024-12-31"

# Solo para flujo_vigia: cuántos meses antes se buscan los procesos. El proceso
# siempre precede al contrato, así que su ventana tiene que empezar antes.
margen_meses_procesos: 6

# Columnas a convertir a fecha. En SECOP II vienen como MM/DD/YYYY.
columnas_fecha:
  - fecha_de_firma
  - fecha_de_inicio_del_contrato
  - fecha_de_fin_del_contrato

formato_fecha: "%m/%d/%Y"

# Montos en formato colombiano ("$13.339.049" -> 13339049.0)
columnas_moneda:
  - valor_del_contrato
  - valor_pagado
  - valor_pendiente_de_pago

# Duraciones en días entre fechas clave del contrato
duraciones:
  - nombre: dias_firma_a_inicio
    desde: fecha_de_firma
    hasta: fecha_de_inicio_del_contrato
  - nombre: dias_inicio_a_fin
    desde: fecha_de_inicio_del_contrato
    hasta: fecha_de_fin_del_contrato
